[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aixand-connect"
version = "0.1.0b0"
description = "Private device file transfers, project tests, and remote Codex chats for Aixand Suite"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aixand-connect = "aixand_connect.companion:main"

[tool.setuptools.packages.find]
include = ["aixand_connect*"]
