schema = 2
profile = "workspace"

[workspace]
name = "suite-tools"
version = "0.1.0-alpha.1"
default-product = "aixand-suite/orchestration-mcp"
targets = ["linux-x86_64-gnu", "linux-arm64-gnu", "macos-x86_64", "macos-arm64", "windows-x86_64-msvc"]

[components.orchestration]
adapter = "payload"
path = "mcps/orchestration"
manifest = "pyproject.toml"
build = [["{python}", "-B", "{root}/scripts/package-orchestration.py", "--output", "{output}", "--target", "{target}"]]

[products."aixand-suite/orchestration-mcp"]
adapter = "python"
version = "0.1.0-alpha.1"
components = ["orchestration"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:orchestration-mcp}", "--version"], ["{command:orchestration-mcp}", "--help"], ["{python}", "-I", "-c", "import orchestration_mcp.executions, orchestration_mcp.workflows, runner_client, aixand_connect"]]

[products."aixand-suite/orchestration-mcp".extras]
aixand-orchestration-mcp = ["runtime", "resources", "runner", "carrier", "connect"]

[products."aixand-suite/orchestration-mcp".commands.orchestration-mcp]
program = "bin/orchestration-mcp"
runtime = "python"

[runtimes.python]
role = "python"
version = "3.12.14"

[runtimes.python.targets.linux-x86_64-gnu]
path = "build/runtimes/linux-x86_64-gnu.tar.gz"
sha256 = "7ce4a71285d913955a76053cc7605ea96da8ecada54dba9cf395245961816421"
executable = "bin/python3"
strip = 1

[runtimes.python.targets.linux-arm64-gnu]
