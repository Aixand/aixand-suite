[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aixand-python"
version = "0.1.0b0"
description = "Ergonomic composition of Agent Manager, Carrier, and Undercurrent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aixand-platform>=0.1.0b0,<0.2",
    "agent-manager[sdk]>=0.1.0b0,<0.2",
    "undercurrent-sdk>=0.1.0b0,<0.2",
    "carrier-mcp>=0.1.0b0,<0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aixand = ["py.typed"]

[tool.uv.sources]
aixand-platform = { path = "../../aixand-platform", editable = true }
