name: Repository files

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Repository file policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject assistant files in the current tracked tree
        run: python3 scripts/checks/check-repository-files.py
      - name: Check every introduced commit
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$POLICY_BASE" ] && [ "$POLICY_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$POLICY_BASE^{commit}" 2>/dev/null; then
            python3 scripts/checks/check-repository-files.py --base "$POLICY_BASE" --head "$POLICY_HEAD"
          else
            # A force-pushed snapshot may have no fetchable previous root.
            # Check its complete commit tree, rather than an invalid range.
            python3 scripts/checks/check-repository-files.py --base "$POLICY_HEAD" --head "$POLICY_HEAD"
          fi
      - name: Test the policy and commit hook
        run: python3 tests/tooling/checks/repository_files_test.py
