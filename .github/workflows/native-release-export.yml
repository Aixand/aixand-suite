name: Export qualified native release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: suite/vVERSION, server/vVERSION or client/vVERSION; select that tag as ref
        type: string
        required: true
      run-id:
        description: Successful native build at the exact tag commit
        type: string
        required: true
      artifact-ids:
        description: Comma-separated artifact IDs from the native build
        type: string
        required: true
      qualifications:
        description: Committed release/qualification/*.json listing role, target, package and actual proof; Suite requires nine entries
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          # Bootstrap CPython has native installers on all hosts; packaged runtimes use uv's pinned 3.12.14.
          python-version: '3.12.10'
      - name: Authenticate native inputs
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run-id }}
          ARTIFACT_IDS: ${{ inputs.artifact-ids }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          python -B scripts/release/github-release.py trust --tag "$TAG" --run-id "$RUN_ID" --artifact-ids "$ARTIFACT_IDS"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.artifact-ids }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: build/release-inputs
      - name: Bind actual platform evidence to exact installer bytes
        env:
          TAG: ${{ inputs.tag }}
          QUALIFICATIONS: ${{ inputs.qualifications }}
        run: |
          python -B - <<'PYTHON'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from hosted import export
          from components import require
          index = Path(os.environ['QUALIFICATIONS'])
          require(not index.is_symlink() and index.resolve().is_relative_to(Path('release/qualification').resolve()), 'Use committed release/qualification metadata')
          subprocess.run(['git', 'ls-files', '--error-unmatch', '--', str(index)], check=True)
          tag = os.environ['TAG']
          component = tag.split('/')[0]
          default_role = {'suite': 'desktop', 'server': 'server', 'client': 'client'}[component]
          identities = set()
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for row in json.loads(index.read_text())['artifacts']:
              package = Path(row['package'])
              require(package.resolve().is_relative_to(Path('build/release-inputs').resolve()), 'Package must come from authenticated build')
              role = row.get('role', default_role)
              require(role in ({'desktop', 'client', 'server'} if component == 'suite' else {default_role}), 'Wrong installer role for release')
              require((role, row['target']) not in identities, 'Duplicate native role/target')
              identities.add((role, row['target']))
              export(package, Path('build/native-exports') / role / row['target'], role=role,
                     version=tag.split('/v')[1], target=row['target'], revision=revision,
                     sequence=row['sequence'], qualification=Path(row['qualification']))
          if component == 'suite':
              require(identities == {(role, target) for role in ('desktop', 'client', 'server') for target in ('linux-x86_64-gnu', 'macos-arm64', 'windows-x86_64-msvc')}, 'Suite hub requires all nine qualified installers')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualified-native-exports
          path: |
            build/native-exports
            build/release-inputs
          if-no-files-found: error
