name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the checker
        run: python3 tests/tooling/checks/docs_test.py
      - name: Check selected documentation
        run: python3 scripts/checks/check-docs.py --root .
      # Diagram rendering and visual review follow docs/development/documentation.md.
      # Offline checks do not establish behavior or destination-renderer support.
