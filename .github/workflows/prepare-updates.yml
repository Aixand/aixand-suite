name: Prepare signed update delivery

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; select that tag as the workflow ref
        type: string
        required: true
      run-id:
        description: Successful build at the exact tag commit
        type: string
        required: true
      artifact-ids:
        description: Comma-separated artifact IDs from that run
        type: string
        required: true
      descriptor:
        description: Committed release/updates/*.json descriptor referring to build/release-inputs paths
        type: string
        required: true
      kind:
        type: choice
        options: [components, application]
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: update-signing-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: update-signing
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Authenticate build artifacts
        env:
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run-id }}
          ARTIFACT_IDS: ${{ inputs.artifact-ids }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          python -B scripts/release/github-release.py trust --tag "$TAG" --run-id "$RUN_ID" --artifact-ids "$ARTIFACT_IDS"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.artifact-ids }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: build/release-inputs
      - name: Sign a candidate and prepare GitHub/Cloudflare delivery
        env:
          TAG: ${{ inputs.tag }}
          DESCRIPTOR: ${{ inputs.descriptor }}
          KIND: ${{ inputs.kind }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python -B - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/release')
          import importlib.util
          spec = importlib.util.spec_from_file_location('prepare_signing', 'scripts/release/prepare-signing.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          prepare = module.prepare
          descriptor = Path(os.environ['DESCRIPTOR'])
          if descriptor.is_symlink() or not descriptor.resolve().is_relative_to(Path('release/updates').resolve()) or descriptor.suffix != '.json':
              raise SystemExit('Use a committed release/updates/*.json descriptor')
          subprocess.run(['git', 'ls-files', '--error-unmatch', '--', str(descriptor)], check=True)
          descriptor = prepare(json.loads(descriptor.read_text()), Path('build/release-inputs'), Path('build/signing-inputs'))
          key = Path(os.environ['RUNNER_TEMP']) / 'suite-update-signing.pem'
          try:
              with key.open('x') as stream:
                  key.chmod(0o600)
                  stream.write(os.environ['UPDATE_SIGNING_KEY'])
              signer = 'scripts/release/sign-components.mjs' if os.environ['KIND'] == 'components' else 'scripts/prepare-update-release.mjs'
              subprocess.run(['node', signer, str(descriptor), str(key), 'build/signed'], check=True)
              subprocess.run(['node', 'scripts/release/delivery.mjs', 'build/signed', 'build/delivery', os.environ['TAG']], check=True)
          finally:
              key.unlink(missing_ok=True)
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: signed-release-delivery
          path: |
            build/delivery
            build/release-inputs
          if-no-files-found: error
