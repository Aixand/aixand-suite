[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aixand-suite-mcp"
version = "0.1.0b0"
description = "Versioned stdio adapters and scoped Suite application tool contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["orchestration-mcp>=0.1.0b0,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
