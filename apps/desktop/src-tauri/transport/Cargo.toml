[package]
license = "Apache-2.0"
repository = "https://github.com/Aixand/aixand-suite"
name = "aixand-client-transport"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "cookies"] }
cookie_store = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
