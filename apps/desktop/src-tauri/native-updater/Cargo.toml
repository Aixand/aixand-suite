[package]
name = "aixand-native-updater"
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
