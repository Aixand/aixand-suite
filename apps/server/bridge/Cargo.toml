[package]
license = "Apache-2.0"
repository = "https://github.com/Aixand/aixand-suite"
name = "aixand-terminal-bridge"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
undercurrent-cli = { path = "../../../../undercurrent/crates/undercurrent-cli" }
undercurrent-sdk = { package = "aixand-undercurrent", path = "../../../../undercurrent/crates/undercurrent-sdk" }
undercurrent-protocol = { package = "aixand-undercurrent-protocol", path = "../../../../undercurrent/crates/undercurrent-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
