[package]
name = "aixand-ir-aixand"
description = "Rust bindings to the existing Aixand and Carrier SDKs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
sdk-tests = []

[dependencies]
aixand-ir.workspace = true
aixand-ir-runner.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[dev-dependencies]
tokio-util.workspace = true
clap.workspace = true
aixand-ir-frontend = { version = "0.1.0-alpha.1", path = "../aixand-ir-frontend" }

# CPython host initialization needs a narrowly allowed FFI module. Keep the
# workspace rules everywhere else; `forbid` cannot be overridden in that module.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
