name: Runner product installers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-14, windows-2022]
    defaults:
      run:
        working-directory: aixand-suite/workflow/runner
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: aixand-suite
          persist-credentials: false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          repository: ${{ vars.AIXAND_LIBRARIES_REPOSITORY }}
          ref: ${{ vars.AIXAND_LIBRARIES_REF || 'main' }}
          path: aixand-libraries
          persist-credentials: false
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          repository: Aixand/undercurrent
          ref: main
          path: undercurrent
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.14'
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.7'
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: uv sync --project tools --locked --python 3.12.14
      - name: Native Windows command launcher toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: python -B scripts/product_checks.py check
      - run: python -B scripts/product_checks.py test
      - name: Build and qualify native product and SDK
        run: python -B scripts/build_installers.py --output dist/installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ runner.os }}-${{ runner.arch }}
          path: aixand-suite/workflow/runner/dist/installers/
          if-no-files-found: error
