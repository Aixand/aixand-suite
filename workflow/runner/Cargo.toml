[package]
name = "aixand-job-runner"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.95"
description = "Local durable jobs for Aixand IR workflows"
license = "Apache-2.0"
repository = "https://github.com/Aixand/aixand-suite"
readme = "README.md"

[lib]
name = "job_runner"

[[bin]]
name = "runner"
path = "src/main.rs"

[features]
default = []
sdk = ["dep:aixand-ir-aixand"]

[dependencies]
aixand-ir = { version = "0.1.0-alpha.1", path = "../ir/crates/aixand-ir" }
aixand-ir-runner = { version = "0.1.0-alpha.1", path = "../ir/crates/aixand-ir-runner" }
aixand-ir-verifier = { version = "0.1.0-alpha.1", path = "../ir/crates/aixand-ir-verifier" }
aixand-ir-aixand = { version = "0.1.0-alpha.1", path = "../ir/crates/aixand-ir-aixand", optional = true }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
undercurrent-platform-windows = { package = "aixand-undercurrent-platform-windows", version = "=0.1.0-beta", path = "../../../undercurrent/crates/undercurrent-platform-windows" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
