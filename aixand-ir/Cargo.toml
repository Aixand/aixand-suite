[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
aixand-ir = { version = "0.1.0-beta", path = "crates/aixand-ir" }
aixand-ir-runner = { version = "0.1.0-beta", path = "crates/aixand-ir-runner" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
jsonschema = { version = "0.49.9", default-features = false }
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
